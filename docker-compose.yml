services:
  audit-env:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bulwark
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # A login carries the account's claude.ai connectors (Gmail, Slack, Drive). Agents read
      # untrusted target code with Bash, so they must not have them.
      - ENABLE_CLAUDEAI_MCP_SERVERS=false
      # BULWARK_ROOT = project dir (bulwark.toml + context/ + optional prompts/ overrides).
      # Set BULWARK_PROJECT on the host to point at your project directory.
      # Default: current directory (works when running from inside a project dir).
      - BULWARK_ROOT=/home/auditor/project
      # BULWARK_INSTALL = the tool install dir (built-in prompts, schemas, ATTACK_PATTERNS.md).
      - BULWARK_INSTALL=/home/auditor
    volumes:
      # Mount the project directory (bulwark.toml + context/ + optional prompts/ overrides).
      # Set BULWARK_PROJECT=/path/to/your/project on the host, or run from inside the project dir.
      - ${BULWARK_PROJECT:-.}:/home/auditor/project:ro
      # Persist audit outputs and workspace between runs
      - audit-outputs:/home/auditor/audits
      # Mount host Claude credentials (login auth only — not the whole .claude dir)
      - ${HOME}/.claude/.credentials.json:/home/auditor/.claude-host-creds/credentials.json:ro
      # Reports land here on the host after each run
      - ./reports:/home/auditor/reports
    stdin_open: true
    tty: true
    # Resource requirements for multi-agent pipeline
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: "8"

  # Live run dashboard: `docker compose up -d dashboard`, then `ssh -L 8484:localhost:8484 <host>`.
  dashboard:
    image: bulwark-audit-env
    container_name: bulwark-dash
    # The image keeps its own built-in bulwark.toml in /home/auditor, so start in the project.
    working_dir: /home/auditor/project
    entrypoint: ["/usr/local/bin/bulwark"]
    command: ["dashboard", "--bind", "0.0.0.0"]
    environment:
      - BULWARK_INSTALL=/home/auditor
    volumes:
      - ${BULWARK_PROJECT:-.}:/home/auditor/project:ro
      - audit-outputs:/home/auditor/audits:ro
    ports:
      - "127.0.0.1:8484:8484"
    restart: unless-stopped

volumes:
  audit-outputs:
