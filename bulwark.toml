[target]
repo = "https://github.com/graphprotocol/contracts.git"
branch = "main"
scope = ["packages/horizon", "packages/subgraph-service"]
core_contracts = [
    "HorizonStaking",
    "HorizonStakingExtension",
    "GraphPayments",
    "PaymentsEscrow",
    "GraphTallyCollector",
    "SubgraphService",
    "DisputeManager",
]
math_sensitive = [
    "HorizonStaking",
    "HorizonStakingExtension",
    "GraphPayments",
    "PaymentsEscrow",
]

# Claude model per stage; these are the defaults. Pass 2 agents are keyed by name.
# A table, so it must sit after every top-level key.
# [models]
# red              = "claude-opus-5-5"
# gold             = "claude-opus-5-5"
# blue             = "claude-sonnet-5-5"
# scv_scan         = "claude-sonnet-5-5"
# variant_analysis = "claude-sonnet-5-5"
# fp_check         = "claude-opus-5-5"
# poc              = "claude-opus-5-5"
# fuzzing          = "claude-sonnet-5-5"
# formal           = "claude-sonnet-5-5"
# review           = "claude-opus-5-5"

[budget]
# Hard cap on Claude spend for one run. Each pass gets its share of what is left;
# PoCs are attempted highest severity first. Spend is recorded in <workspace>/cost.json.
max_usd = 20.0

[workspace]
path = "audit-workspace"

[passes.recon]
enabled = true
scv_scan = true              # AI vulnerability scan after Slither (requires Claude auth)
scv_scan_max_turns = 20

[passes.agents]
enabled = true
max_turns = 80
agents = ["red", "blue", "gold"]
timeout_minutes = 60
variant_analysis = true      # Search for pattern variants in high/critical findings
variant_max_turns = 15

[passes.poc]
enabled = true
max_turns = 30
max_retries = 2
fp_check = true              # Pre-filter findings with false-positive check
fp_check_max_turns = 15
# Fork mode: PoCs run against deployed contracts at a pinned block. Without it every
# PoC is at most inconclusive.
# fork_rpc_env = "BULWARK_FORK_RPC"
# fork_block = 21_000_000

[passes.fuzzing]
enabled = true
fuzz_runs = 10_000
invariant_depth = 50
medusa_timeout = 3600
echidna_limit = 500_000
max_turns = 40

[passes.formal]
enabled = true
solver_timeout = 300
loop_bound = 5
target_properties = ["P-1", "P-10", "P-15", "P-16", "P-19"]
max_turns = 30

[passes.review]
enabled = true
max_turns = 60

# Override tool paths if not on PATH
# [tools]
# forge = "/home/auditor/.foundry/bin/forge"
# slither = "/usr/local/bin/slither"
# claude = "/home/auditor/.local/bin/claude"

[prompts]
dir = "prompts"

[schemas]
dir = "schemas"
