# Bench case: BattleChain Confidence Pools, CodeHawks 2026-07-09..07-16.
# Judged after the agents' training cutoff.

[target]
repo = "https://github.com/CodeHawks-Contests/2026-07-bc-confidence-pools.git"
branch = "main"
commit = "58e8ba4ce3f3277866e4926f3140e597f9554a1e"
scope = ["."]
core_contracts = ["ConfidencePool", "ConfidencePoolFactory"]
math_sensitive = ["ConfidencePool"]

[workspace]
path = "audit-workspace"

[passes.recon]
enabled = true
scv_scan = true

[passes.agents]
enabled = true
agents = ["red", "blue", "gold"]
variant_analysis = true

[[passes.agents.components]]
name = "pool"
files = ["src/ConfidencePool.sol"]

[[passes.agents.components]]
name = "factory"
files = ["src/ConfidencePoolFactory.sol"]

[passes.poc]
enabled = true
max_retries = 2
fp_check = true

[passes.fuzzing]
enabled = true
fuzz_runs = 10_000
invariant_depth = 50

[passes.formal]
enabled = true
solver_timeout = 300
loop_bound = 5

[passes.review]
enabled = true

[prompts]
dir = "prompts"

[schemas]
dir = "schemas"
